{{/*
Render ExternalSecret CRs from .Values.eso.externalSecrets dict.
Each key in the dict becomes a resource named <fullname>-<key>.
Included in library.app — rendered when eso.externalSecrets is non-empty.

apiVersion: external-secrets.io/v1
ref: https://external-secrets.io/latest/api/externalsecret/
*/}}
{{- define "library.externalSecrets" -}}
{{- range $name, $es := .Values.eso.externalSecrets }}
{{- $res := deepCopy $es }}
{{- if $res.spec }}
{{- $_ := set $res "spec" (include "library._externalSecretSpecWithDefaults" $res.spec | fromYaml) }}
{{- end }}
{{ include "library._crdResource" (dict
  "name"       $name
  "res"        $res
  "kind"       "ExternalSecret"
  "apiVersion" "external-secrets.io/v1"
  "namespaced" true
  "context"    $) }}
{{- end }}
{{- end -}}

{{/*
Fields the ESO CRDs default server-side. Rendering them keeps Argo CD from
reporting every ExternalSecret as OutOfSync.
*/}}
{{- define "library._externalSecretDefaults" -}}
target:
  creationPolicy: Owner
  deletionPolicy: Retain
remoteRef:
  conversionStrategy: Default
  decodingStrategy: None
  metadataPolicy: None
  nullBytePolicy: Ignore
find:
  conversionStrategy: Default
  decodingStrategy: None
{{- end -}}

{{/*
An ExternalSecret spec with the server defaults filled in; a value the spec
sets explicitly always wins. Generator sourceRef entries are left as they are.
*/}}
{{- define "library._externalSecretSpecWithDefaults" -}}
{{- $d := include "library._externalSecretDefaults" . | fromYaml }}
{{- $spec := deepCopy . }}
{{- $_ := set $spec "target" (merge (deepCopy ($spec.target | default dict)) $d.target) }}
{{- if $spec.data }}
{{- $data := list }}
{{- range $spec.data }}
{{- $item := deepCopy . }}
{{- if $item.remoteRef }}
{{- $_ := set $item "remoteRef" (merge $item.remoteRef (deepCopy $d.remoteRef)) }}
{{- end }}
{{- $data = append $data $item }}
{{- end }}
{{- $_ := set $spec "data" $data }}
{{- end }}
{{- if $spec.dataFrom }}
{{- $dataFrom := list }}
{{- range $spec.dataFrom }}
{{- $item := deepCopy . }}
{{- if $item.extract }}
{{- $_ := set $item "extract" (merge $item.extract (deepCopy $d.remoteRef)) }}
{{- end }}
{{- if $item.find }}
{{- $_ := set $item "find" (merge $item.find (deepCopy $d.find)) }}
{{- end }}
{{- $dataFrom = append $dataFrom $item }}
{{- end }}
{{- $_ := set $spec "dataFrom" $dataFrom }}
{{- end }}
{{- toYaml $spec }}
{{- end -}}
