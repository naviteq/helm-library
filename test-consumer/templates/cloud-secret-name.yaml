{{- /* Exercises library.cloudSecretName; renders only when a scenario sets cloudSecretNameProbe. */}}
{{- with .Values.cloudSecretNameProbe }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" $ }}-cloud-secret-name
data:
  name: {{ include "library.cloudSecretName" (dict "style" .style "segments" .segments) | quote }}
{{- end }}
