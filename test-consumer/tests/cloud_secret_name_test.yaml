suite: library.cloudSecretName
templates:
  - cloud-secret-name.yaml

tests:
  - it: joins segments with dashes for the flat style
    values:
      - ../ci/13-network-policy.yaml
    asserts:
      - equal:
          path: data.name
          value: prod-app-db

  - it: joins segments as a slash path by default
    values:
      - ../ci/13-network-policy.yaml
    set:
      cloudSecretNameProbe.style: ""
    asserts:
      - equal:
          path: data.name
          value: /prod/app/db

  - it: fails on an unknown style
    values:
      - ../ci/13-network-policy.yaml
    set:
      cloudSecretNameProbe.style: colon
    asserts:
      - failedTemplate:
          errorMessage: 'secret name style must be "path" or "flat", got "colon"'
